services:
  payload:
    image: node:24-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare npm@latest --activate && npm install && npm run dev"
    depends_on:
      - postgres
    env_file:
      - payload.env

  postgres:
    restart: always
    image: postgres:18
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    env_file:
      - postgres.env

volumes:
  pgdata:
  node_modules:
