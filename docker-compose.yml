services:
  payload:
    image: node:24-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare npm@latest --activate && npm install && npm run dev"
    depends_on:
      - postgres
    environment:
      - USE_DATABASE=postgres
      - DATABASE_URL=postgres://postgres:mittpostgrespassord12345@postgres:5432/mitt-cms
      - PAYLOAD_SECRET=f5f7f7037db54eb457232a66

  postgres:
    restart: always
    image: postgres:18
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mittpostgrespassord12345
      - POSTGRES_DB=mitt-cms

volumes:
  pgdata:
  node_modules:
