services:
  payload:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - media:/app/media

  postgres:
    restart: always
    image: postgres:18
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    env_file:
      - .env

volumes:
  media:
  pgdata: